name: Build and test

on:
  push:
    branches: [main]
    paths:
      - "Codity-RA2311027010093/backend/**"
      - "Codity-RA2311027010093/frontend/**"
      - ".github/workflows/build-and-test.yml"
  pull_request:
    branches: [main]
    paths:
      - "Codity-RA2311027010093/backend/**"
      - "Codity-RA2311027010093/frontend/**"
      - ".github/workflows/build-and-test.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobscheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobscheduler_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Codity-RA2311027010093/backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobscheduler_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply schema to test database
        run: npx prisma db push
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codity-RA2311027010093/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build
